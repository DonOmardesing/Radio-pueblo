<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#120b06">
<title>Don Omar Radio | Cantina Clásica</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080503;
    color: #f1dfc0;
    font-family: Georgia, "Times New Roman", serif;
}
body {
    display: flex;
    justify-content: center;
    align-items: center;
}
/* RELOJ */
.top-clock {
    position: fixed;
    top: 14px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 100;
    font-family: monospace;
    font-size: 13px;
    letter-spacing: 4px;
    color: #b99a6b;
    opacity: .75;
}
/* ESCENARIO */
.container {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        linear-gradient(
            rgba(10,5,2,.45),
            rgba(10,5,2,.78)
        ),
        url('https://i.postimg.cc/JhRyzN2Q/IMG-4736.jpg')
        no-repeat center center;
    background-size: cover;
}
/* VIÑETA & LUZ DE LÁMPARA DE GAS */
.container:before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(212, 143, 61, 0.15) 0%,
            transparent 50%
        ),
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0,0,0,.4) 70%,
            rgba(0,0,0,.9) 100%
        );
    pointer-events: none;
    z-index: 2;
}
/* GRANO DE PELÍCULA */
.container:after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .08;
    pointer-events: none;
    z-index: 3;
    background-image:
        repeating-radial-gradient(
            circle at 0 0,
            rgba(255,255,255,.15) 0,
            rgba(255,255,255,.15) 1px,
            transparent 1px,
            transparent 4px
        );
}
/* CABECERA */
.header {
    position: absolute;
    top: 9%;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    text-align: center;
    z-index: 5;
}
.kicker {
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 6px;
    color: #d2ac6f;
    margin-bottom: 12px;
    text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0,0,0,.8);
}
.logo-wrapper {
    position: relative;
    display: inline-block;
}
/* Efecto de resplandor sutil (lámpara de queroseno) */
.logo-wrapper::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 120%;
    height: 120%;
    background: radial-gradient(circle, rgba(220,150,60,0.22) 0%, transparent 70%);
    z-index: -1;
    pointer-events: none;
    animation: gasLampFlicker 6s ease-in-out infinite alternate;
}
@keyframes gasLampFlicker {
    0% { opacity: 0.7; transform: translate(-50%, -50%) scale(0.95); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
}
.logo {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(32px, 7.5vw, 68px);
    font-weight: bold;
    letter-spacing: 3px;
    color: #f3e2bc;
    text-shadow:
        3px 3px 0px #210e05,
        0 6px 24px rgba(0,0,0,.85);
}
.line {
    width: 140px;
    height: 1px;
    margin: 14px auto;
    background: linear-gradient(90deg, transparent, #b88a4c, transparent);
    opacity: .8;
}
.subtitle {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: clamp(13px, 2.8vw, 18px);
    color: #dfcaa2;
    letter-spacing: 1px;
    text-shadow: 0 2px 6px rgba(0,0,0,.8);
}
/* PANEL DE PLAYLISTS */
.playlists {
    position: absolute;
    z-index: 10;
    left: 50%;
    bottom: 8.5%;
    transform: translateX(-50%);
    width: min(92%, 1050px);
    display: flex;
    justify-content: center;
    gap: 18px;
}
/* BOTONES ESTILO CUERO Y MADERA PULIDA */
.btn {
    position: relative;
    width: 31%;
    min-height: 125px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #ead7b0;
    border: 1px solid rgba(185, 137, 72, 0.75);
    border-radius: 6px;
    background: 
        radial-gradient(circle at top left, rgba(82, 43, 20, 0.9), transparent 70%),
        linear-gradient(145deg, rgba(38, 19, 9, 0.98), rgba(15, 7, 3, 0.99));
    box-shadow:
        inset 0 0 0 2px rgba(0, 0, 0, 0.4),
        inset 0 0 25px rgba(0, 0, 0, 0.7),
        0 10px 25px rgba(0, 0, 0, 0.6);
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
}
.btn::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(205, 160, 95, 0.22);
    border-radius: 4px;
    pointer-events: none;
}
.btn:hover, .btn:active {
    transform: translateY(-5px);
    border-color: #e2b36b;
    box-shadow:
        inset 0 0 30px rgba(0, 0, 0, 0.6),
        0 14px 32px rgba(0, 0, 0, 0.8),
        0 0 20px rgba(195, 138, 65, 0.25);
}
/* ICONOS */
.btn-icon {
    font-size: 30px;
    margin-bottom: 10px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7));
}
/* TEXTO */
.btn-text {
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #f2d7a2;
}
.btn-small {
    margin-top: 6px;
    font-family: Arial, sans-serif;
    font-size: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #a38254;
}
/* PIE */
.footer {
    position: absolute;
    bottom: 2.2%;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
    font-family: Arial, sans-serif;
    font-size: 8px;
    letter-spacing: 4px;
    color: #8c724c;
    text-transform: uppercase;
}
/* DISEÑO MÓVIL ADAPTATIVO */
@media (max-width: 600px) {
    .header {
        top: 8%;
    }
    .kicker {
        font-size: 8px;
        letter-spacing: 4px;
    }
    .logo {
        font-size: 36px;
        letter-spacing: 2px;
    }
    .subtitle {
        font-size: 12px;
        padding: 0 16px;
        line-height: 1.4;
    }
    .playlists {
        bottom: 8%;
        width: 90%;
        flex-direction: column;
        gap: 10px;
    }
    .btn {
        width: 100%;
        min-height: 78px;
        flex-direction: row;
        justify-content: flex-start;
        padding: 0 20px;
    }
    .btn-icon {
        font-size: 24px;
        margin: 0 16px 0 0;
        width: 32px;
        text-align: center;
    }
    .btn-text {
        font-size: 12px;
        letter-spacing: 2px;
    }
    .btn-small {
        margin: 4px 0 0;
    }
    .footer {
        bottom: 1.8%;
    }
}
</style>
</head>
<body>

<div class="top-clock" id="topClock">00:00:00</div>

<div class="container">
    <div class="header">
        <div class="kicker">Una estación para escuchar sin afán</div>
        <div class="logo-wrapper">
            <div class="logo">DON OMAR RADIO</div>
        </div>
        <div class="line"></div>
        <div class="subtitle">
            Canciones para hombres que ya tienen historias que contar.
        </div>
    </div>

    <div class="playlists">
        <a href="https://open.spotify.com/playlist/63FDBH6Adjor4HuSzu0pBe?si=HcvPeiCtTFKXnfHrpVNhvg&utm_source=copy-link&pi=kNqz121qR9SEi" class="btn" target="_blank" rel="noopener noreferrer">
            <div class="btn-icon">🥃</div>
            <div>
                <div class="btn-text">RON AÑEJO</div>
                <div class="btn-small">Música con carácter</div>
            </div>
        </a>
        <a href="https://open.spotify.com/playlist/2BEgpbPSIEHhj3x8eWqwIO?si=PEV9GjVlQS2iMQs9hzwdCg&utm_source=copy-link&pi=awQOpnl7Rj-PL" class="btn" target="_blank" rel="noopener noreferrer">
            <div class="btn-icon">🎸</div>
            <div>
                <div class="btn-text">GUARO HTA</div>
                <div class="btn-small">Para escuchar despacio</div>
            </div>
        </a>
        <a href="https://open.spotify.com/playlist/3mW1tGh25uqPzC2lpuEhnX?si=vGTNCkxARaWz8x8yYw7wuQ&utm_source=copy-link&pi=1kCp4njXTXysI" class="btn" target="_blank" rel="noopener noreferrer">
            <div class="btn-icon">💿</div>
            <div>
                <div class="btn-text">VIEJOS AMORES</div>
                <div class="btn-small">Canciones que no envejecen</div>
            </div>
        </a>
    </div>

    <div class="footer">
        DON OMAR · MEDELLÍN · COLOMBIA
    </div>
</div>

<script>
function pad(n) {
    return n < 10 ? '0' + n : '' + n;
}
function updateClock() {
    var d = new Date();
    document.getElementById('topClock').textContent =
        pad(d.getHours()) + ':' +
        pad(d.getMinutes()) + ':' +
        pad(d.getSeconds());
}
updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
