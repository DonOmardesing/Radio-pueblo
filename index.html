<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#120b06">
<title>Don Omar Radio Bar</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080503;
    color: #f1dfc0;
    font-family: Georgia, "Times New Roman", serif;
}
body {
    display: flex;
    justify-content: center;
    align-items: center;
}
/* RELOJ MEJORADO */
.top-clock {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    font-family: monospace;
    font-size: 15px;
    letter-spacing: 5px;
    color: #f3d79b;
    padding: 6px 18px;
    background: rgba(20, 10, 4, 0.75);
    border: 1px solid rgba(195, 145, 75, 0.65);
    border-radius: 4px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6), inset 0 0 10px rgba(195, 145, 75, 0.2);
    text-shadow: 0 0 8px rgba(243, 215, 155, 0.4);
}
/* ESCENARIO */
.container {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        linear-gradient(
            rgba(10,5,2,.45),
            rgba(10,5,2,.78)
        ),
        url('https://i.postimg.cc/JhRyzN2Q/IMG-4736.jpg')
        no-repeat center center;
    background-size: cover;
}
/* VIÑETA & LUZ DE LÁMPARA DE GAS */
.container:before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(225, 150, 65, 0.22) 0%,
            transparent 55%
        ),
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0,0,0,.4) 70%,
            rgba(0,0,0,.9) 100%
        );
    pointer-events: none;
    z-index: 2;
}
/* GRANO DE PELÍCULA */
.container:after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .08;
    pointer-events: none;
    z-index: 3;
    background-image:
        repeating-radial-gradient(
            circle at 0 0,
            rgba(255,255,255,.15) 0,
            rgba(255,255,255,.15) 1px,
            transparent 1px,
            transparent 4px
        );
}
/* CABECERA (SOLO TÍTULO CON MÁS BRILLO) */
.header {
    position: absolute;
    top: 13%;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    text-align: center;
    z-index: 5;
}
.logo-wrapper {
    position: relative;
    display: inline-block;
}
.logo-wrapper::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 140%;
    height: 140%;
    background: radial-gradient(circle, rgba(255, 180, 80, 0.35) 0%, transparent 70%);
    z-index: -1;
    pointer-events: none;
    animation: gasLampFlicker 5s ease-in-out infinite alternate;
}
@keyframes gasLampFlicker {
    0% { opacity: 0.8; transform: translate(-50%, -50%) scale(0.95); }
    50% { opacity: 1.2; transform: translate(-50%, -50%) scale(1.08); }
    100% { opacity: 0.9; transform: translate(-50%, -50%) scale(1); }
}
.logo {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(34px, 7.5vw, 68px);
    font-weight: bold;
    letter-spacing: 3px;
    color: #fff1d0;
    text-shadow:
        3px 3px 0px #1a0802,
        0 0 25px rgba(255, 200, 100, 0.6),
        0 8px 30px rgba(0,0,0,.9);
}
/* PANEL DE PLAYLISTS (4 BOTONES) */
.playlists {
    position: absolute;
    z-index: 10;
    left: 50%;
    bottom: 7%;
    transform: translateX(-50%);
    width: min(94%, 1150px);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}
/* BOTONES ESTILO CUERO Y MADERA PULIDA */
.btn {
    position: relative;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #ead7b0;
    border: 1px solid rgba(185, 137, 72, 0.75);
    border-radius: 6px;
    background: 
        radial-gradient(circle at top left, rgba(82, 43, 20, 0.9), transparent 70%),
        linear-gradient(145deg, rgba(38, 19, 9, 0.98), rgba(15, 7, 3, 0.99));
    box-shadow:
        inset 0 0 0 2px rgba(0, 0, 0, 0.4),
        inset 0 0 25px rgba(0, 0, 0, 0.7),
        0 10px 25px rgba(0, 0, 0, 0.6);
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    padding: 12px 8px;
    text-align: center;
}
.btn::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(205, 160, 95, 0.22);
    border-radius: 4px;
    pointer-events: none;
}
.btn:hover, .btn:active {
    transform: translateY(-5px);
    border-color: #e2b36b;
    box-shadow:
        inset 0 0 30px rgba(0, 0, 0, 0.6),
        0 14px 32px rgba(0, 0, 0, 0.8),
        0 0 20px rgba(195, 138, 65, 0.25);
}
/* ICONOS */
.btn-icon {
    font-size: 26px;
    margin-bottom: 8px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7));
}
/* TEXTO */
.btn-text {
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #f2d7a2;
}
/* PIE */
.footer {
    position: absolute;
    bottom: 2%;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
    font-family: Arial, sans-serif;
    font-size: 8px;
    letter-spacing: 4px;
    color: #8c724c;
    text-transform: uppercase;
}
/* DISEÑO MÓVIL ADAPTATIVO */
@media (max-width: 900px) {
    .playlists {
        grid-template-columns: repeat(2, 1fr);
        bottom: 6%;
    }
}
@media (max-width: 600px) {
    .header {
        top: 12%;
    }
    .logo {
        font-size: 32px;
        letter-spacing: 2px;
    }
    .playlists {
        width: 90%;
        grid-template-columns: 1fr;
        gap: 10px;
        bottom: 6%;
    }
    .btn {
        min-height: 68px;
        flex-direction: row;
        justify-content: flex-start;
        padding: 0 20px;
    }
    .btn-icon {
        font-size: 22px;
        margin: 0 16px 0 0;
    }
    .btn-text {
        font-size: 12px;
        letter-spacing: 2px;
    }
    .footer {
        bottom: 1.5%;
    }
}
</style>
</head>
<body>

<div class="top-clock" id="topClock">00:00:00</div>

<div class="container">
    <div class="header">
        <div class="logo-wrapper">
            <div class="logo">DON OMAR RADIO BAR</div>
        </div>
    </div>

    <div class="playlists">
        <a href="https://open.spotify.com/playlist/63FDBH6Adjor4HuSzu0pBe?si=HcvPeiCtTFKXnfHrpVNhvg&utm_source=copy-link&pi=kNqz121qR9SEi" class="btn" target="_blank" rel="noopener noreferrer">
            <div class="btn-icon">🍺</div>
            <div class="btn-text">CERVEZA Y RON</div>
        </a>
        <a href="https://open.spotify.com/playlist/2BEgpbPSIEHhj3x8eWqwIO?si=PEV9GjVlQS2iMQs9hzwdCg&utm_source=copy-link&pi=awQOpnl7Rj-PL" class="btn" target="_blank" rel="noopener noreferrer">
            <div class="btn-icon">🥃</div>
            <div class="btn-text">CHICHA Y GUARO</div>
        </a>
        <a href="https://open.spotify.com/playlist/3mW1tGh25uqPzC2lpuEhnX?si=vGTNCkxARaWz8x8yYw7wuQ&utm_source=copy-link&pi=1kCp4njXTXysI" class="btn" target="_blank" rel="noopener noreferrer">
            <div class="btn-icon">🇲🇽</div>
            <div class="btn-text">TEQUILA Y MEZCAL</div>
        </a>
        <a href="https://open.spotify.com/playlist/3REM0lEOfc06CmlBA85QRC?si=zutd7fAaRx677oOaQMxmtg&utm_source=copy-link&pi=PXZ5gkr2Q7q-I" class="btn" target="_blank" rel="noopener noreferrer">
            <div class="btn-icon">🧉</div>
            <div class="btn-text">WISKY Y MATE</div>
        </a>
    </div>

    <div class="footer">
        DON OMAR · MEDELLÍN · COLOMBIA
    </div>
</div>

<script>
function pad(n) {
    return n < 10 ? '0' + n : '' + n;
}
function updateClock() {
    var d = new Date();
    document.getElementById('topClock').textContent =
        pad(d.getHours()) + ':' +
        pad(d.getMinutes()) + ':' +
        pad(d.getSeconds());
}
updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
